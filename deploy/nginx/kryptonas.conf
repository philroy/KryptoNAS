# KryptoNAS Dashboard - Nginx reverse proxy configuration
#
# Add this server block to your existing /etc/nginx/nginx.conf inside the http {} block,
# or include this file from within your http {} block:
#   include /path/to/kryptonas.conf;
#
# The map directive below must also be inside the http {} block.
# If you already have a similar map for $connection_upgrade, skip the duplicate.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kryptonas_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name cache.philroy.au;

    access_log /var/log/nginx/kryptonas.access.log;
    error_log  /var/log/nginx/kryptonas.error.log;

    location / {
        proxy_pass http://kryptonas_backend;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep WebSocket connections alive (24h)
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}
